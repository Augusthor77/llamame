<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SeñaVoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#F4F6F8;--ink:#10243A;--muted:#566677;--panel:#FFFFFF;--line:#D3DBE3;--accent:#1B4F8A;--on-accent:#FFFFFF;--sig:#F2B632;--cap-bg:rgba(10,20,32,.84);--cap-ink:#FFFFFF;--cap:22px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1520;--ink:#EAF0F6;--muted:#93A3B5;--panel:#142233;--line:#26384D;--accent:#8FBBF2;--on-accent:#0C1520}}
:root[data-theme="dark"]{--bg:#0C1520;--ink:#EAF0F6;--muted:#93A3B5;--panel:#142233;--line:#26384D;--accent:#8FBBF2;--on-accent:#0C1520}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45}
main{max-width:720px;margin:0 auto;padding:14px 14px 190px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 12px;font-size:15px}
.stage{position:relative;aspect-ratio:4/3;background:#0A141F;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
video{display:none;object-fit:cover}
#rv{width:100%;height:100%}
#lv{position:absolute;top:8px;right:8px;width:30%;aspect-ratio:3/4;border-radius:10px;border:2px solid var(--sig);transform:scaleX(-1);background:#000}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#C9D6E3}
.cap{position:absolute;left:8px;right:8px;bottom:8px;background:var(--cap-bg);color:var(--cap-ink);border-radius:10px;padding:10px 12px;font-size:var(--cap);line-height:1.3;display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button{font:inherit;border-radius:10px;border:2px solid var(--accent);background:transparent;color:var(--accent);padding:11px 14px;min-height:48px;cursor:pointer}
button.main-btn,button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
.hint{color:var(--muted);font-size:15px;margin:0 0 8px}
#log{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:calc(var(--cap) - 2px)}
.msg small{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}
.msg.mine{align-self:flex-end;border-color:var(--accent)}
.compose{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none}
.compose .in{max-width:720px;margin:0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chips button{white-space:nowrap;min-height:40px;padding:6px 12px;font-size:15px}
.send{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:18px;padding:11px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
#call{display:none}
.code{font-size:30px;font-weight:700;letter-spacing:.12em}
</style>
</head>
<body>
<main>
  <h1>SeñaVoz</h1>
  <p class="sub">Videollamada entre personas sordas y oyentes.</p>

  <section id="lobby">
    <p>Una persona crea la sala y le comparte el código a la otra. Las dos abren esta misma página.</p>
    <div class="row"><button class="main-btn" id="btnNew">Crear sala</button></div>
    <form class="send" onsubmit="return false">
      <input type="text" id="code" placeholder="Código de la sala" autocomplete="off" aria-label="Código de la sala" maxlength="12">
      <button id="btnJoin" type="button">Entrar</button>
    </form>
    <p class="hint" id="lobbyMsg"></p>
  </section>

  <section id="call">
    <div class="stage">
      <video id="rv" playsinline autoplay></video>
      <video id="lv" playsinline muted autoplay></video>
      <div class="empty" id="empty"></div>
      <div class="cap" id="cap" aria-live="polite"></div>
    </div>
    <div class="row">
      <button id="btnListen" aria-pressed="false">Subtitular mi voz</button>
      <button id="btnVoice" aria-pressed="true">Leer en voz alta</button>
      <button id="sm" aria-label="Letra más pequeña">A−</button>
      <button id="lg" aria-label="Letra más grande">A+</button>
      <button id="btnLeave">Salir</button>
    </div>
    <p class="hint" id="status"></p>
    <div id="log" aria-live="polite"></div>
  </section>
</main>

<div class="compose" id="compose">
  <div class="in">
    <div class="chips" id="chips"></div>
    <form class="send" onsubmit="return false">
      <input type="text" id="msg" placeholder="Escribe un mensaje" autocomplete="off" aria-label="Mensaje">
      <button class="main-btn" id="btnSend" type="button">Enviar</button>
    </form>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var PREFIX='senavoz-',peer=null,conn=null,mediaCall=null,stream=null,isHost=false,roomId='';
  var rec=null,listening=false,voiceOn=true,size=22,capTimer=null,lastCap=0;

  function status(t){$('status').textContent=t}
  function lobby(t){$('lobbyMsg').textContent=t}
  function say(cls,who,text){
    var d=document.createElement('div');d.className='msg '+(cls==='mine'?'mine':'');
    var s=document.createElement('small');s.textContent=who;
    var p=document.createElement('span');p.textContent=text;
    d.appendChild(s);d.appendChild(p);$('log').appendChild(d);d.scrollIntoView({block:'nearest'});
  }
  function showCap(t){
    var c=$('cap');c.style.display='block';c.textContent=t;
    clearTimeout(capTimer);capTimer=setTimeout(function(){c.style.display='none'},6000);
  }
  function speak(t){
    try{if(!voiceOn||!window.speechSynthesis)return;
      var u=new SpeechSynthesisUtterance(t);u.lang='es-CO';speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
  }
  function sendData(d){if(conn&&conn.open)conn.send(d)}
  function empty(html,code){
    var e=$('empty');e.style.display='flex';e.innerHTML='';
    var a=document.createElement('div');a.textContent=html;e.appendChild(a);
    if(code){var b=document.createElement('div');b.className='code';b.textContent=code;e.appendChild(b)}
  }

  /* ---------- cámara ---------- */
  function blankStream(){
    var c=document.createElement('canvas');c.width=160;c.height=120;
    c.getContext('2d').fillRect(0,0,160,120);return c.captureStream(1);
  }
  function startCam(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return Promise.resolve('Este navegador no permite usar la cámara (la página debe abrirse con https).');
    return navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}).then(function(s){
      stream=s;var v=$('lv');v.srcObject=s;v.style.display='block';return '';
    }).catch(function(e){return 'No pudimos abrir tu cámara ('+(e.name||'error')+'). Puedes entrar igual y ver a la otra persona.'});
  }

  /* ---------- conexión con PeerJS ---------- */
  function onRemoteStream(s){
    var v=$('rv');v.srcObject=s;v.style.display='block';$('empty').style.display='none';
  }
  function attachCall(c){
    mediaCall=c;c.on('stream',onRemoteStream);
    c.on('close',function(){$('rv').style.display='none';empty('La otra persona salió.')});
  }
  function attachConn(c){
    conn=c;
    c.on('open',function(){status('Conectados. Toca “Subtitular mi voz” si vas a hablar.');if(!isHost)empty('Conectando video…')});
    c.on('data',function(x){
      if(!x||typeof x.t!=='string')return;var t=x.t.slice(0,500);
      if(x.k==='cap'){showCap(t);if(x.f)say('','Voz',t)}
      else if(x.k==='txt'){say('','Escrito',t);speak(t)}
    });
    c.on('close',function(){status('La otra persona salió.')});
  }
  function enter(code,host){
    code=(code||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    if(code.length<3){lobby('Escribe un código de al menos 3 letras o números.');return}
    if(!window.Peer){lobby('No se pudo cargar el conector. Revisa tu internet.');return}
    isHost=host;roomId=code;lobby('Entrando…');
    startCam().then(function(camMsg){
      peer=host?new Peer(PREFIX+code):new Peer();
      peer.on('error',function(e){
        if(e.type==='unavailable-id'){show(false);lobby('Ese código ya está en uso. Crea la sala otra vez.')}
        else if(e.type==='peer-unavailable'){show(false);lobby('No existe una sala con ese código. Revisa que la otra persona ya la haya creado.')}
        else status('Problema de conexión: '+e.type);
      });
      peer.on('open',function(){
        show(true);
        status(camMsg||'Listo.');
        if(host){
          empty('Esperando a la otra persona. Código de la sala:',code.toUpperCase());
          peer.on('connection',attachConn);
          peer.on('call',function(c){c.answer(stream||blankStream());attachCall(c)});
        }else{
          empty('Conectando…');
          attachConn(peer.connect(PREFIX+code,{reliable:true}));
          attachCall(peer.call(PREFIX+code,stream||blankStream()));
        }
      });
    });
  }
  function show(inCall){
    $('lobby').style.display=inCall?'none':'block';
    $('call').style.display=inCall?'block':'none';
    $('compose').style.display=inCall?'block':'none';
  }
  $('btnNew').onclick=function(){
    var c='',k='abcdefghjkmnpqrstuvwxyz23456789';
    for(var i=0;i<4;i++)c+=k[Math.floor(Math.random()*k.length)];
    enter(c,true);
  };
  $('btnJoin').onclick=function(){enter($('code').value,false)};
  $('btnLeave').onclick=function(){location.reload()};

  /* ---------- subtítulos de mi voz ---------- */
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  function startRec(){
    rec=new SR();rec.lang='es-CO';rec.continuous=true;rec.interimResults=true;
    rec.onresult=function(e){
      var interim='';
      for(var i=e.resultIndex;i<e.results.length;i++){
        var r=e.results[i],t=r[0].transcript.trim();
        if(r.isFinal){if(t){say('mine','Tú (voz)',t);sendData({k:'cap',t:t.slice(0,500),f:1})}}
        else interim+=t+' ';
      }
      interim=interim.trim();
      if(interim&&Date.now()-lastCap>300){lastCap=Date.now();sendData({k:'cap',t:interim.slice(0,500),f:0})}
    };
    rec.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;syncL();status('Falta el permiso del micrófono.')}};
    rec.onend=function(){if(listening){try{rec.start()}catch(e){}}};
    try{rec.start()}catch(e){}
  }
  function syncL(){var b=$('btnListen');b.setAttribute('aria-pressed',listening?'true':'false');b.textContent=listening?'Detener subtítulos':'Subtitular mi voz'}
  $('btnListen').onclick=function(){
    if(!SR){status('Los subtítulos de voz funcionan en Chrome o Edge.');return}
    listening=!listening;syncL();
    if(listening){status('Enviando tus palabras como subtítulos.');startRec()}
    else{status('Subtítulos detenidos.');try{rec.stop()}catch(e){}}
  };
  $('btnVoice').onclick=function(){
    voiceOn=!voiceOn;this.setAttribute('aria-pressed',voiceOn?'true':'false');
    if(!voiceOn&&window.speechSynthesis)speechSynthesis.cancel();
  };
  function setSize(n){size=Math.max(16,Math.min(44,n));document.documentElement.style.setProperty('--cap',size+'px')}
  $('sm').onclick=function(){setSize(size-4)};
  $('lg').onclick=function(){setSize(size+4)};

  /* ---------- mensajes escritos ---------- */
  function send(t){
    var m=$('msg');t=(t||m.value).trim();if(!t)return;
    say('mine','Tú',t);sendData({k:'txt',t:t.slice(0,500)});m.value='';
  }
  $('btnSend').onclick=function(){send()};
  $('msg').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();send()}});
  ['Hola, soy una persona sorda.','Más despacio, por favor.','¿Puede repetirlo?','Sí, entiendo.','No entendí.','Gracias.'].forEach(function(t){
    var b=document.createElement('button');b.type='button';b.textContent=t;
    b.onclick=function(){send(t)};$('chips').appendChild(b);
  });
})();
</script>
</body>
</html>
